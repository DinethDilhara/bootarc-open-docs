name: MDX Validation

on:
  pull_request:
    paths:
      - "docs/**/*.mdx"
      - "blogs/**/*.mdx"
      - "case-studies/**/*.mdx"
      - "projects/**/*.mdx"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mdx-validation.yml"
      - ".github/scripts/validate-mdx.mjs"

  push:
    branches:
      - main
    paths:
      - "docs/**/*.mdx"
      - "blogs/**/*.mdx"
      - "case-studies/**/*.mdx"
      - "projects/**/*.mdx"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mdx-validation.yml"
      - ".github/scripts/validate-mdx.mjs"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mdx:
    name: Validate MDX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout content
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile MDX files
        run: pnpm validate:mdx
